services:
  - type: web
    name: shift-prediction-v3
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: ENGINE_PACKAGE
        value: shift_engine_package_v3_day_first_reader
